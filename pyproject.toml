[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cad-to-robot"
version = "0.1.0"
description = "Reconstructed CAD contour to robot waypoint pipeline"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26,<3", "matplotlib>=3.9,<4", "trimesh==4.4.9", "scipy>=1.13,<2", "networkx>=3.3,<4"]

[project.optional-dependencies]
test = ["pytest>=7.4,<9"]

[project.scripts]
cad-to-robot = "cad_to_robot.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
